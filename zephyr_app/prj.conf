CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Raw OpenAMP (remote/device role); the resource table comes from src/rsc_table.c
CONFIG_OPENAMP=y
CONFIG_MBOX=y

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096

# Shell on uart0 for "rpmsg send <text...>"
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
